services:
  - type: web
    name: harvis-delights
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    autoDeployTrigger: commit
    disk:
      name: product-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: harvis-delights-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATA_DIR
        value: /var/data
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: harvis-delights-db
    databaseName: harvis_delights
    user: harvis_delights_user
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 1
    storageAutoscalingEnabled: true
