<article class="product" data-category="{{ product.category.slug }}"><a class="product-image" href="{{ product.get_absolute_url }}">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}">{% else %}<span>{{ product.name|slice:':1' }}</span>{% endif %}</a><div class="product-copy"><small>{{ product.category.name }} {% if product.weight %}· {{ product.weight }}{% endif %}</small><h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3><p>{{ product.short_description }}</p><div class="price-row"><strong>₹{{ product.price }}</strong><button class="add" data-add data-id="{{ product.id }}" data-name="{{ product.name }}" data-price="{{ product.price }}" {% if product.image %}data-image="{{ product.image.url }}"{% endif %}>Add to cart</button></div></div></article>
